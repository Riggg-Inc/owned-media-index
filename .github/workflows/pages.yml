name: Deploy MkDocs site

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check video reference source/publication parity
        run: python scripts/check_video_reference.py

      - name: Build site
        env:
          OMI_GA_MEASUREMENT_ID: G-T1FBFDLCRE
          OMI_PRIVACY_URL: https://riggg.com/privacy-policy/
        run: mkdocs build --strict

      - name: Validate AEO metadata, source summaries, links and breadcrumbs
        run: |
          python scripts/validate_site.py
          python scripts/validate_aeo.py
          python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

