{# Invoked only after Material's explicit analytics consent gate. #}
<script id="__analytics">
function __md_analytics() {
  if (window.omiAnalyticsStarted) return;
  window.omiAnalyticsStarted = true;
  var id = {{ config.extra.analytics.property | tojson }};
  window.dataLayer = window.dataLayer || [];
  function gtag() { window.dataLayer.push(arguments); }
  function safeUrl(value) {
    try { var u = new URL(value); return u.origin + u.pathname; }
    catch (_) { return ''; }
  }
  gtag('js', new Date());
  gtag('config', id, {
    send_page_view: false,
    allow_google_signals: false,
    allow_ad_personalization_signals: false,
    page_location: location.origin + location.pathname,
    page_referrer: safeUrl(document.referrer)
  });
  gtag('event', 'page_view', {
    page_location: location.origin + location.pathname,
    page_referrer: safeUrl(document.referrer),
    page_title: document.title
  });
  document.addEventListener('click', function(event) {
    var a = event.target.closest && event.target.closest('a[href]');
    if (!a) return;
    var u;
    try { u = new URL(a.href); } catch (_) { return; }
    if (u.protocol !== 'https:' && u.protocol !== 'http:') return;
    if (u.hostname === 'riggg.com' || u.hostname === 'www.riggg.com') {
      gtag('event', 'riggg_visit', {link_url: safeUrl(u.href), link_domain: u.hostname});
    }
  });
  var script = document.createElement('script');
  script.async = true;
  script.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
  document.head.appendChild(script);
}
</script>
